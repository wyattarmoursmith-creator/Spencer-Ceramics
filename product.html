<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Craig Spencer Ceramics · Piece</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="A hand-thrown piece by Craig Spencer Ceramics, made and signed in Auckland, New Zealand." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Craig Spencer Ceramics" />
<meta property="og:title" content="A piece by Craig Spencer Ceramics" />
<meta property="og:image" content="https://spencerceramics.netlify.app/images/og-cover.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Schibsted+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="product">

  <nav class="menu" aria-label="Mobile">
    <a href="shop.html">Shop</a>
    <a href="about.html">Studio</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">Cart</a>
  </nav>

  <nav class="nav nav--solid" aria-label="Primary">
    <a class="nav__brand wordmark" href="index.html">Craig&nbsp;Spencer&nbsp;Ceramics</a>
    <div class="nav__links">
      <a href="shop.html">Shop</a>
      <a href="about.html">Studio</a>
      <a href="contact.html">Contact</a>
        <a class="nav__cart" href="cart.html">Cart&nbsp;(<span data-cart-count>0</span>)</a>
    </div>
    <button class="nav__burger" aria-label="Menu">☰</button>
  </nav>

  <div style="padding:22px var(--gutter); border-bottom:1px solid var(--rule);">
    <a class="link-underline" href="shop.html" style="font-size:13px; white-space:nowrap"><span>←</span> Back to shop</a>
  </div>

  <main class="pd" data-pd-root>
    <!-- filled by JS from ?id= -->
  </main>

  <section class="pd__related">
    <div class="selected__head" style="margin-bottom:48px">
      <div><div class="label">More from this edition</div></div>
      <a class="link-underline" href="shop.html">All work <span>→</span></a>
    </div>
    <div class="grid grid--three" id="related"></div>
  </section>

  <footer class="footer">
    <div class="footer__cell"><span>Craig Spencer Ceramics</span><b data-site="year">MMXXVI</b></div>
    <div class="footer__cell"><span>Studio</span><b data-site="location">Auckland, NZ</b></div>
    <div class="footer__cell"><span>Journal</span><a href="journal.html">Notes from the studio →</a></div>
    <div class="footer__cell"><span>Instagram</span><a data-site="instagram" href="https://www.instagram.com/spencerceramics">@spencerceramics</a></div>
    <div class="footer__credit"><a href="faq.html">Shipping &amp; FAQ</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · Site by <a href="https://wyattsmithmedia.com" target="_blank" rel="noopener">Wyatt&nbsp;Smith&nbsp;Media</a></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/media.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/site.js"></script>
  <script>
    window.onData(function () {
      if (!window.CATALOG.length) {
        document.querySelector("[data-pd-root]").innerHTML =
          '<p class="label" style="padding:60px var(--gutter)">This piece is no longer available. <a class="link-underline" href="shop.html">Back to the shop &rarr;</a></p>';
        return;
      }
      var id = new URLSearchParams(location.search).get("id") || window.CATALOG[0].id;
      var p = window.byId(id) || window.CATALOG[0];
      document.title = p.name + " · Craig Spencer Ceramics";
      var sold = p.state === "sold";

      // SEO: per-piece description, canonical, and Product schema (price + availability for Google Shopping surfaces)
      var desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute("content", (p.desc || p.name + ", a hand-thrown piece") + " Made and signed by Craig Spencer in Auckland, New Zealand.");
      var base = "https://spencerceramics.netlify.app/product.html?id=" + p.id;
      var canon = document.querySelector('link[rel="canonical"]');
      if (!canon) { canon = document.createElement("link"); canon.rel = "canonical"; document.head.appendChild(canon); }
      canon.href = base;
      var ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org", "@type": "Product",
        "name": p.name, "sku": String(p.ref), "description": p.desc || "",
        "image": p.img.indexOf("http") === 0 ? p.img : "https://spencerceramics.netlify.app/" + p.img,
        "brand": { "@type": "Brand", "name": "Craig Spencer Ceramics" },
        "offers": {
          "@type": "Offer", "url": base,
          "price": p.price.toFixed(2), "priceCurrency": (window.SHOPIFY ? window.SHOPIFY.currency : "NZD"),
          "availability": sold ? "https://schema.org/SoldOut" : "https://schema.org/InStock"
        }
      });
      document.head.appendChild(ld);

      // dimension/material split out of spec for the meta list
      var parts = p.spec ? p.spec.split(" · ") : [];

      document.querySelector("[data-pd-root]").innerHTML =
        '<div class="pd__gallery">' +
          '<div class="pd__img"><img src="' + p.img + '" alt="' + p.name + '" data-media="' + p.id + '"></div>' +
          '<div class="pd__thumbs">' +
            '<div class="pd__img"><img loading="lazy" decoding="async" src="' + p.img + '" alt="" data-media="' + p.id + '"></div>' +
            '<div class="pd__img"><img loading="lazy" decoding="async" src="' + p.img + '" alt="" data-media="' + p.id + '"></div>' +
          '</div>' +
        '</div>' +
        '<aside class="pd__panel">' +
          '<div class="label">N° ' + p.ref + ' · ' + (sold ? 'Sold' : (p.state.charAt(0).toUpperCase() + p.state.slice(1))) + '</div>' +
          '<h1 class="pd__name">' + p.name + '</h1>' +
          '<div class="pd__price tnum">$ ' + p.price.toFixed(2) + ' ' + (window.SHOPIFY ? window.SHOPIFY.currency : 'NZD') + '</div>' +
          '<p class="pd__desc">' + (p.desc || 'Thrown and finished by hand in the Auckland studio. Each one carries its own surface, and its own weight in the hand.') + '</p>' +
          '<div class="pd__meta">' +
            parts.map(function (x, i) {
              var keys = ["Glaze / slip", "Body", "Dimensions"];
              return '<div><span>' + (keys[i] || "Detail") + '</span><span>' + x + '</span></div>';
            }).join("") +
            (/\bof\b/.test(p.state) ? '<div><span>Edition</span><span>' + p.state + '</span></div>' : '') +
          '</div>' +
          '<div class="pd__buy">' +
            (sold
              ? '<button class="btn btn--ghost btn--block" disabled style="opacity:.5; cursor:not-allowed">Sold</button>'
              : '<button class="btn btn--fill btn--block" data-add="' + p.id + '" data-label="Add to cart · $ ' + p.price + '">Add to cart · $ ' + p.price + ' <span class="arrow">&rarr;</span></button>') +
          '</div>' +
          '<div class="pd__note">One of a kind where marked. Securely wrapped and packed by hand, tracking provided. <a class="link-underline" href="faq.html" style="font-size:12px">Shipping &amp; FAQ</a></div>' +
        '</aside>';

      // related = other pieces
      document.getElementById("related").innerHTML = window.CATALOG
        .filter(function (x) { return x.id !== p.id; }).slice(0, 3)
        .map(function (q) {
          return '' +
          '<a class="card" href="product.html?id=' + q.id + '">' +
            '<div class="card__media"><span class="card__no">N° ' + q.ref + '</span>' +
              '<img loading="lazy" decoding="async" src="' + q.img + '" alt="' + q.name + '" data-media="' + q.id + '"></div>' +
            '<div class="card__row"><div><div class="card__name">' + q.name + '</div>' +
              '<div class="card__spec">' + q.spec + '</div></div>' +
              '<div class="card__price tnum">$ ' + q.price + '</div></div>' +
          '</a>';
        }).join("");

      // Add-to-cart is wired once by js/site.js (initAddButtons), which runs on
      // DOMContentLoaded - after this inline script injects the button. Do NOT
      // bind a second handler here or the item gets added twice.
    });
  </script>
</body>
</html>
