  <script>
    window.onData(function () {
      var id = new URLSearchParams(location.search).get("id");
      var p = window.postById(id) || window.JOURNAL[0];
      document.title = p.title + " · Craig Spencer Ceramics · Journal";

      // SEO: per-post description, canonical, and Article schema so Google can reference each note
      var desc = document.querySelector('meta[name="description"]');
      if (desc && p.excerpt) desc.setAttribute("content", p.excerpt);
      var base = "https://spencerceramics.netlify.app/journal-post.html?id=" + p.id;
      var canon = document.querySelector('link[rel="canonical"]');
      if (!canon) { canon = document.createElement("link"); canon.rel = "canonical"; document.head.appendChild(canon); }
      canon.href = base;
      var ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org", "@type": "Article",
        "headline": p.title, "description": p.excerpt || "",
        "image": "https://spencerceramics.netlify.app/" + p.img,
        "author": { "@type": "Person", "name": "Craig Spencer" },
        "publisher": { "@type": "Organization", "name": "Craig Spencer Ceramics" },
        "mainEntityOfPage": base
      });
      document.head.appendChild(ld);
      document.getElementById("a-hero").src = p.img;
      document.getElementById("a-hero").alt = p.title;
      document.getElementById("a-hero").setAttribute("data-media", p.id);
      if(window.applyFocus) window.applyFocus();

      document.querySelector("[data-article-root]").innerHTML =
        '<div class="article__meta"><span class="label">' + p.date + '</span>' +
          '<span class="label">' + p.tag + '</span></div>' +
        '<h1 class="article__title">' + p.title + '</h1>' +
        '<div class="article__lede">' +
          (p.body || "").split(/\n{2,}/).map(function (para) { return '<p>' + para.trim() + '</p>'; }).join("") +
        '</div>' +
        '<div class="article__foot">' +
          '<a class="link-underline" href="journal.html"><span>←</span> All notes</a>' +
          '<a class="link-underline" href="shop.html">Shop the work <span>→</span></a>' +
        '</div>';
    });
  </script>
